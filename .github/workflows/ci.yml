name: Basic CI

on:
  push:
    branches: [ main ] 
  pull_request:         # <-- Запуск CI при создании/обновлении PR
    branches: [ main ]    
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest 'httpx<0.28' flake8 pytest-cov bandit

      - name: Run linter (critical errors only)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Security check with bandit  # <-- Проверка безопасности
        run: bandit -r . -x venv,tests  

      - name: Run tests with coverage
        run: pytest --cov=. --cov-fail-under=70 # Тесты запускаются 1 раз, сразу с покрытием

